name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      size_mb: ${{ steps.size.outputs.size_mb }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          repo=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tag=$(printf '%s' "${{ github.ref_name }}" | tr '/' '-')
          printf 'image=ghcr.io/%s:%s\n' "$repo" "$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: size
        name: Check image size
        run: |
          bytes=$(docker image inspect "${{ steps.image.outputs.image }}" --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          printf 'size_mb=%s\n' "$mb" >> "$GITHUB_OUTPUT"
          printf 'Container image size: %s MB\n' "$mb" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 209715200 ]; then
            printf 'Image is %s MB, limit is 200 MB\n' "$mb" >&2
            exit 1
          fi
      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Report image
        run: printf 'Deploying %s (%s MB)\n' "${{ needs.image.outputs.image }}" "${{ needs.image.outputs.size_mb }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy tag to Fly.io
        run: |
          flyctl deploy \
            --remote-only \
            --image "${{ needs.image.outputs.image }}" \
            --env "VERSION=${{ github.ref_name }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
