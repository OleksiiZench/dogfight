services:
  dogfight:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-dogfight:local}
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERSION: ${VERSION:-local}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-256}
      PING_INTERVAL_MS: ${PING_INTERVAL_MS:-15000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
